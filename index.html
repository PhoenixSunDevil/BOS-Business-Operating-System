<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherion BOS — Sign in</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<style>
/* Login page */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.login-card {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow);
  width: 100%; max-width: 380px; padding: 28px;
}
.login-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .5px; margin-bottom: 18px; }
.login-card h1 { margin: 0 0 4px; font-size: 22px; }
.login-sub { margin: 0 0 18px; font-size: 13px; color: var(--text-2); }
.login-card form label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.login-card form label input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); margin-top: 4px; font: inherit; color: inherit; }
.login-error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.login-hint { margin: 16px 0 0; font-size: 11.5px; color: var(--text-2); }
</style>
</head>
<body class="theme-light">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="bos-logo">◈</span>
        <span class="bos-name">AETHERION BOS</span>
      </div>
      <h1>Sign in</h1>
      <p class="login-sub">Business Operating System — access is granted per user.</p>
      <form onsubmit="return bosDoLogin(event)">
        <label>Username<input id="login-user" type="text" autocomplete="username" required></label>
        <label>Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn" style="width:100%;justify-content:center">Sign in</button>
        <p id="login-error" class="login-error" hidden>Invalid username or password.</p>
      </form>
      <p class="login-hint">First run: admin / admin1234 — change it from Admin after signing in.</p>
    </div>
  </main>

  <script src="js/modules/registry.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/permissions.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/persistence.js"></script>
  <script src="js/nav/router.js"></script>
  <script src="js/nav/shell.js"></script>
  <script src="js/nav/admin.js"></script>
  <script src="js/nav/login.js"></script>
</body>
</html>
