<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherion BOS — Sign in</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="theme-light">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="bos-logo">◈</span>
        <span class="bos-name">AETHERION BOS</span>
      </div>
      <h1>Sign in</h1>
      <p class="login-sub">Business Operating System — access is granted per user.</p>
      <form onsubmit="return bosDoLogin(event)">
        <label>Username<input id="login-user" type="text" autocomplete="username" required></label>
        <label>Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn" style="width:100%;justify-content:center">Sign in</button>
        <p id="login-error" class="login-error" hidden>Invalid username or password.</p>
      </form>
      <p class="login-hint">First run: admin / admin1234 — change it from Admin after signing in.</p>
    </div>
  </main>

  <script src="js/modules/registry.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/permissions.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/persistence.js"></script>
  <script src="js/nav/router.js"></script>
  <script src="js/nav/shell.js"></script>
  <script src="js/nav/login.js"></script>
</body>
</html>
