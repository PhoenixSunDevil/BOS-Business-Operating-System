<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherion BOS — Business Operating System</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="theme-light">
  <header id="bos-header">
    <div class="bos-brand">
      <span class="bos-logo">◈</span>
      <span class="bos-name">AETHERION BOS</span>
    </div>
    <nav id="main-nav" role="navigation" aria-label="Main BOS modules"></nav>
    <div class="bos-tools">
      <button id="storage-badge" type="button" class="storage-badge" onclick="bosOpenStorageModal()" title="Storage status — click to configure Google Apps Script storage">Storage: local session</button>
      <input id="global-search" type="search" placeholder="Search…" aria-label="Global search">
      <button id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      <div class="bos-user" id="user-badge" title="Signed-in user">…</div>
      <button id="logout-btn" type="button" class="link-btn" onclick="bosLogout()" title="Sign out">Sign out</button>
    </div>
  </header>

  <main id="workspace">
    <div id="breadcrumb" class="breadcrumb" aria-label="Navigation path"></div>
    <section id="module-host" class="module-host" aria-live="polite"></section>
  </main>

  <script src="js/modules/registry.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/permissions.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/persistence.js"></script>
  <script src="js/nav/router.js"></script>
  <script src="js/nav/shell.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
